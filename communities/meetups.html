<style>
  :root{

  }
  @media (prefers-color-scheme: dark){

      --bg:#14161a; --card:#1c1f26; --ink:#eceff3; --sub:#9aa3b2; --line:#2b2f38;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161a; --card:#1c1f26; --ink:#eceff3; --sub:#9aa3b2; --line:#2b2f38;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; margin:0; padding:32px 20px 80px;}
  h1{font-size:1.6rem; margin:0 0 4px;}
  .lead{color:var(--sub); margin:0 0 28px; font-size:0.95rem;}
  .groups-nav{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:28px;}
  .groups-nav button{border:1px solid var(--line); background:var(--card); color:var(--ink); padding:8px 14px; border-radius:999px; font-size:0.85rem; cursor:pointer;}
  .groups-nav button.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}
  .summary-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-bottom:32px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px;}
  .stat-card .num{font-size:1.8rem; font-weight:700;}
  .stat-card .label{color:var(--sub); font-size:0.82rem; margin-top:2px;}
  .group-block{margin-bottom:44px;}
  .group-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:6px;}
  .group-head h2{margin:0; font-size:1.25rem;}
  .dot{width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:8px;}
  .group-meta{color:var(--sub); font-size:0.85rem; margin-bottom:16px;}
  .metrics-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px;}
  .metric{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px;}
  .metric .v{font-size:1.3rem; font-weight:700;}
  .metric .k{color:var(--sub); font-size:0.78rem;}
  .topics{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px;}
  .topic-pill{background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-size:0.78rem; color:var(--sub);}
  table{width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; font-size:0.85rem;}
  thead th{text-align:left; padding:10px 12px; background:rgba(127,127,127,0.08); color:var(--sub); font-weight:600; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.03em;}
  tbody td{padding:10px 12px; border-top:1px solid var(--line); vertical-align:top;}
  tbody tr:hover{background:rgba(127,127,127,0.05);}
  .att-bar-wrap{display:flex; align-items:center; gap:8px; min-width:110px;}
  .att-bar-track{flex:1; height:6px; background:rgba(127,127,127,0.15); border-radius:4px; overflow:hidden;}
  .att-bar-fill{height:100%; border-radius:4px;}
  .table-wrap{overflow-x:auto;}
  .venue-cell{max-width:220px;}
  .speakers-cell{max-width:200px; color:var(--sub);}
  .note{background:var(--card); border:1px dashed var(--line); border-radius:10px; padding:14px 16px; font-size:0.82rem; color:var(--sub); margin-bottom:28px;}
  .load-error{display:none; background:#fef3c7; color:#92400e; border:1px solid #fcd34d; border-radius:10px; padding:14px 18px; font-size:0.85rem; margin-bottom:24px;}
  code{background:rgba(127,127,127,0.15); padding:2px 6px; border-radius:4px;}
  .hidden{display:none !important;}
</style>
</head>

<div id="app" class="hidden">
  <div class="summary-grid" id="summaryGrid"></div>
  <div class="groups-nav" id="groupsNav"></div>
  <div id="groupBlocks"></div>
  <div class="note" id="noteBox"></div>
</div>

<script>
const GROUP_COLORS = {
  javascriptmeetup: 'var(--js)',
  'byte-of-python': 'var(--byop)',
  'darling-meetup': 'var(--darl)'
};

function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmt(n){ return n===null||n===undefined ? '—' : n.toLocaleString(); }

function render(data){
  const groups = data.groups;
  const slugs = Object.keys(groups);

  // Summary cards across all groups
  let totalEventsAllTime = 0, totalMembers = 0, totalScraped = 0, weightedRatingSum = 0, ratingCountSum = 0;
  slugs.forEach(s=>{
    const g = groups[s];
    totalEventsAllTime += g.total_events_all_time || 0;
    totalMembers += g.members || 0;
    totalScraped += g.events_scraped || 0;
    if(g.rating && g.rating_count){ weightedRatingSum += g.rating * g.rating_count; ratingCountSum += g.rating_count; }
  });
  const avgRating = ratingCountSum ? (weightedRatingSum/ratingCountSum).toFixed(2) : '—';

  const summaryGrid = document.getElementById('summaryGrid');
  const summaryItems = [
    ['Communities', slugs.length],
    ['Total events (lifetime)', fmt(totalEventsAllTime)],
    ['Total members', fmt(totalMembers)],
    ['Weighted avg rating', avgRating + ' / 5'],
    ['Events with full detail', fmt(totalScraped)]
  ];
  summaryGrid.innerHTML = summaryItems.map(([label,val])=>`
    <div class="card stat-card">
      <div class="num">${esc(val)}</div>
      <div class="label">${esc(label)}</div>
    </div>`).join('');

  // Nav
  const nav = document.getElementById('groupsNav');
  nav.innerHTML = ['all', ...slugs].map(s=>{
    const label = s==='all' ? 'All communities' : groups[s].name;
    return `<button data-target="${s}" class="${s==='all'?'active':''}">${esc(label)}</button>`;
  }).join('');
  nav.addEventListener('click', e=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    nav.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const target = btn.dataset.target;
    document.querySelectorAll('.group-block').forEach(el=>{
      el.classList.toggle('hidden', !(target==='all' || el.dataset.slug===target));
    });
  });

  // Group blocks
  const container = document.getElementById('groupBlocks');
  container.innerHTML = slugs.map(slug=>{
    const g = groups[slug];
    const color = GROUP_COLORS[slug] || 'var(--accent)';
    const atts = g.events.map(e=>e.attendees).filter(a=>a!==null && a!==undefined);
    const maxAtt = atts.length ? Math.max(...atts) : 1;
    const avgAtt = atts.length ? Math.round(atts.reduce((a,b)=>a+b,0)/atts.length) : null;
    const peakEvent = g.events.reduce((best,e)=> (e.attendees||0) > (best.attendees||0) ? e : best, g.events[0]||{});

    const topicsHtml = (g.topics||[]).map(t=>`<span class="topic-pill">${esc(t)}</span>`).join('');

    const rows = g.events.map(e=>{
      const pct = e.attendees ? Math.max(4, Math.round((e.attendees/maxAtt)*100)) : 0;
      const speakers = (e.speakers_mentioned||[]).slice(0,3).join(', ') || '—';
      return `<tr>
        <td>${esc(e.title)}</td>
        <td>${esc(e.date_raw)}</td>
        <td class="venue-cell">${esc(e.venue||'—')}</td>
        <td>
          <div class="att-bar-wrap">
            <span>${fmt(e.attendees)}</span>
            <div class="att-bar-track"><div class="att-bar-fill" style="width:${pct}%; background:${color};"></div></div>
          </div>
        </td>
        <td class="speakers-cell">${esc(speakers)}</td>
        <td>${esc(e.status||'')}</td>
      </tr>`;
    }).join('');

    return `
    <div class="group-block card" data-slug="${slug}" style="border-top:4px solid ${color};">
      <div class="group-head">
        <h2><span class="dot" style="background:${color};"></span>${esc(g.name)}</h2>
      </div>
      <div class="group-meta">${esc(g.location)} · <a href="${esc(g.url)}" target="_blank" rel="noopener">${esc(g.url)}</a></div>

      <div class="metrics-row">
        <div class="metric"><div class="v">${fmt(g.total_events_all_time)}</div><div class="k">Total events (all-time)</div></div>
        <div class="metric"><div class="v">${fmt(g.members)}</div><div class="k">Members</div></div>
        <div class="metric"><div class="v">${g.rating ?? '—'} ★</div><div class="k">Rating (${fmt(g.rating_count)} ratings)</div></div>
        <div class="metric"><div class="v">${fmt(avgAtt)}</div><div class="k">Avg attendees / event</div></div>
        <div class="metric"><div class="v">${fmt(peakEvent && peakEvent.attendees)}</div><div class="k">Peak event: ${esc(peakEvent && peakEvent.title || '')}</div></div>
      </div>

      <div class="topics">${topicsHtml}</div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Event</th><th>Date</th><th>Venue</th><th>Attendees</th><th>Speakers (mentioned)</th><th>Status</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');

  document.getElementById('noteBox').textContent = data.meta && data.meta.note ? data.meta.note : '';
  document.getElementById('app').classList.remove('hidden');
}

function loadData(){
  // Prefer data embedded directly in this page (works with a plain double-click, no server needed).
  const embedded = document.getElementById('embeddedData');
  if(embedded && embedded.textContent.trim()){
    try{ return Promise.resolve(JSON.parse(embedded.textContent)); }catch(e){ console.warn('Embedded data parse failed, falling back to fetch', e); }
  }
  // Fallback: fetch the sibling meetups.json (works when served over http:// or https://).
  return fetch('meetups.json').then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
}

loadData()
  .then(render)
  .catch(err=>{
    console.error(err);
    document.getElementById('loadError').style.display = 'block';
  });
</script>
</body>
</html>
